aid: ferguson
name: Ferguson
description: >-
  Ferguson is a Fortune 500 distributor of plumbing supplies, HVAC products,
  pipe, valves and fittings, waterworks, and building supplies serving
  professional contractors, residential homeowners, and commercial customers
  across the United States. Ferguson runs an Enterprise API program on Google
  Apigee, published through the Ferguson Developer Portal, that lets approved
  partners and software providers pull product availability and cost data and
  submit purchase orders electronically. Access is granted only to organizations
  that complete Ferguson's partner review and approval process, and the API
  catalog and its Swagger documentation are not readable without credentials.
