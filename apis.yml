apis:
  - aid: ferguson:enterprise-apis
    name: Ferguson Enterprise APIs
    description: >-
      A curated set of REST/JSON Enterprise APIs that let approved partners and software
      providers transact with Ferguson — product availability and vendor cost data, and
      electronic purchase-order submission through partner integrations. Delivered on
      Google Apigee and secured with OAuth 2.0 (client-credentials, authorization-code and
      ROPC grants documented; bearer tokens per RFC 6750). No baseURL is recorded because
      Ferguson publishes no API host outside the approval-gated developer portal, and no
      OpenAPI, Postman collection or other machine-readable contract is served on any
      public Ferguson host (probed 2026-09-09).
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ferguson.png
    humanURL: https://developer.ferguson.com/apis
